<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 输出质检工作台</title>
<link rel="stylesheet" href="/quality-panel.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Agent 输出质检工作台</h1>
    <span class="badge" id="engineBadge">引擎状态…</span>
    <span class="badge" id="judgeBadge">裁判后端…</span>
    <span class="badge" id="pkgBadge">规则包：-</span>
  </header>

  <div class="grid">
    <div class="card">
      <h2>待检样本</h2>
      <label>客户输入</label>
      <textarea id="inputText" rows="2">我要投诉，食品发霉了，要求退款赔偿！</textarea>
      <label>Agent 输出（待质检）</label>
      <textarea id="agentOutput" rows="3">亲，您放心，我们保证全额退款给您，联系电话 13812345678。</textarea>
      <div class="row">
        <div>
          <label>Agent 路由</label>
          <select id="agentRoute">
            <option value="auto" selected>auto（自动回复）</option>
            <option value="human_triage">human_triage（转人工）</option>
            <option value="needs_evidence">needs_evidence（需补证）</option>
          </select>
        </div>
        <div>
          <label>风险级别</label>
          <select id="riskLevel">
            <option value="high" selected>high</option>
            <option value="conditional">conditional</option>
            <option value="low">low</option>
          </select>
        </div>
        <div>
          <label>规则包</label>
          <select id="package"></select>
        </div>
      </div>
      <div class="presets">
        <button data-preset="bad">违规样本</button>
        <button data-preset="good">合规样本</button>
        <button data-preset="finance">金融违规样本</button>
      </div>
      <div class="actions">
        <button id="run">开始质检</button>
        <button id="batch">批量质检（20×2）</button>
      </div>
      <div class="metric" id="metric">就绪</div>
    </div>

    <div class="card">
      <h2>质检报告</h2>
      <div id="result"><div class="hint">填写左侧样本后点击「开始质检」。规则层毫秒级判定；Jev/LLM 裁判配置后自动启用语义判定。</div></div>
    </div>
  </div>

  <div class="card" style="margin-top:18px">
    <h2>数据反哺 · 质检数据生产入口</h2>
    <div class="insight-grid" id="insightsZone"><div class="hint">质检产出的结构化数据反哺：培训课件 / 客户画像 / 复购节奏…</div></div>
  </div>
</div>

<script src="/quality-panel.js"></script>
</body>
</html>
